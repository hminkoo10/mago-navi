<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>마고 과목내비</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --ink: #191f28; --sub: #6b7684; --teal: #0f9d8a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17171c; --ink: #f2f4f6; --sub: #9ea6b0; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.6 'Pretendard', 'Malgun Gothic', system-ui, sans-serif; }
      main { text-align: center; padding: 24px; }
      .dot { width: 36px; height: 36px; margin: 0 auto 16px; border: 4px solid color-mix(in srgb, var(--teal) 25%, transparent); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      p { margin: 0; color: var(--sub); }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <p>마고 과목내비를 여는 중이에요…</p>
    </main>
  </body>
</html>
