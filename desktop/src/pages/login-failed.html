<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>마고 과목내비</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --ink: #191f28; --sub: #6b7684; --teal: #0f9d8a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17171c; --ink: #f2f4f6; --sub: #9ea6b0; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.6 'Pretendard', 'Malgun Gothic', system-ui, sans-serif; }
      main { max-width: 440px; padding: 24px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: var(--sub); }
      .btn { display: inline-block; padding: 10px 22px; border-radius: 10px; background: var(--teal); color: #ffffff; font-weight: 600; text-decoration: none; }
      .btn:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <main>
      <h1>로그인하지 못했어요</h1>
      <p>
        통합 클라우드 계정으로 마고 과목내비에 로그인하지 못했어요.<br />
        통합 클라우드에 로그인되어 있는지 확인하고 다시 시도해 주세요.<br />
        계속 안 되면 통합 클라우드에서 이 프로그램을 끄고 다시 켜 주세요.
      </p>
      <a class="btn" href="login-failed.html?retry">다시 시도</a>
    </main>
  </body>
</html>
