# 마고 과목내비 (magonavi.milky.kr) - nginx
#   설치: sudo install -m 644 nginx-magonavi.conf /etc/nginx/sites-available/magonavi.milky.kr
#         sudo ln -s ../sites-available/magonavi.milky.kr /etc/nginx/sites-enabled/magonavi.milky.kr
#         sudo nginx -t && sudo systemctl reload nginx
#   Cloudflare(프록시 켬) → 이 nginx(443) → 127.0.0.1:8480 (mago-navi.service)
#   - 인증서 두 줄은 mago.milky.kr 설정이 쓰는 *.milky.kr 인증서 경로로 바꾸기
#   - Cloudflare SSL 모드는 Full(strict): nginx 가 https 로 받아야 X-Forwarded-Proto 가 https 라 로그인 쿠키(__Host-)가 붙음
#   - 실제 접속 IP: http 블록에 Cloudflare real_ip 설정(set_real_ip_from …, real_ip_header CF-Connecting-IP)이
#     이미 있어야 함 (mago.milky.kr 과 같음). 없으면 요청 제한이 Cloudflare IP 에 걸림
#   - Cloudflare 는 100초 안에 답이 없으면 끊음(524). 편제표 AI 읽기가 그보다 오래 걸리면 화면에 실패로 보임

server {
    listen 80;
    listen [::]:80;
    server_name magonavi.milky.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name magonavi.milky.kr;

    ssl_certificate     /etc/ssl/milky.kr/fullchain.pem;   # 바꾸기: 기존 *.milky.kr 인증서
    ssl_certificate_key /etc/ssl/milky.kr/privkey.pem;     # 바꾸기: 기존 *.milky.kr 개인 키

    # 가장 큰 요청은 편제표 사진 읽기: 사진 4장(장당 data URL 3MB까지) + 글 → 12MB 남짓
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8480;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 서버 요청 시간 상한(210초)보다 조금 길게
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}
